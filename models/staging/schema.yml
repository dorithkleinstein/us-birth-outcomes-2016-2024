version: 2

models:
  - name: stg_births_education
    description: >
      Cleaned and typed CDC WONDER natality data with mother's education dimension (2016-2024).
      One row per state × mother's race × education level × year combination.
      Births is NULL where CDC suppressed the value (small population cell).
      Source seed: births_by_state_education_race_year.csv
    columns:
      - name: region
        description: US Census Region (Northeast, Midwest, South, West)
        data_tests:
          - not_null

      - name: state
        description: Full state name
        data_tests:
          - not_null

      - name: state_code
        description: Two-digit FIPS state code
        data_tests:
          - not_null

      - name: mother_race
        description: Mother's single race category (CDC WONDER classification)
        data_tests:
          - not_null
          - accepted_values:
              values:
                - 'American Indian or Alaska Native'
                - 'Asian'
                - 'Black or African American'
                - 'More than one race'
                - 'Native Hawaiian or Other Pacific Islander'
                - 'White'

      - name: education
        description: >
          Mother's highest education level (CDC WONDER 8-category classification).
          Values: 8th grade or less | 9th through 12th grade with no diploma |
          High school graduate or GED completed | Some college credit, but not a degree |
          Associate degree (AA, AS) | Bachelor's degree (BA, AB, BS) |
          Master's degree (MA, MS, MEng, MEd, MSW, MBA) |
          Doctorate (PhD, EdD) or Professional Degree (MD, DDS, DVM, LLB, JD)
        data_tests:
          - not_null
          # accepted_values test omitted: dbt cannot handle apostrophes in value
          # strings (Bachelor's, Master's) without generating broken SQL.
          # The SQL model itself filters out invalid education categories.

      - name: education_label
        description: >
          Short display label for charts and dashboards. Maps CDC long labels to
          readable short forms: < 9th Grade | Some High School | HS / GED |
          Some College | Associate's | Bachelor's | Master's | Doctorate / Prof.
        data_tests:
          - not_null

      - name: education_code
        description: Numeric education code (1=lowest, 8=highest; CDC ordering)
        data_tests:
          - not_null

      - name: year
        description: Birth year (2016-2024)
        data_tests:
          - not_null

      - name: births
        description: Total births. NULL when CDC suppressed value (cell < 10 births).

      - name: avg_birth_weight_grams
        description: Average birth weight in grams for this group.

      - name: avg_gestational_age_weeks
        description: Average gestational age in weeks (LMP-based).

  - name: stg_births
    description: >
      Cleaned and typed CDC WONDER natality data (2016-2024).
      One row per state × mother's race × year combination.
      Births is NULL where CDC suppressed the value (small population cell).
    columns:
      - name: region
        description: US Census Region (Northeast, Midwest, South, West)
        data_tests:
          - not_null

      - name: state
        description: Full state name
        data_tests:
          - not_null

      - name: state_code
        description: Two-digit FIPS state code
        data_tests:
          - not_null

      - name: mother_race
        description: Mother's single race category (CDC WONDER classification)
        data_tests:
          - not_null
          - accepted_values:
              values:
                - 'American Indian or Alaska Native'
                - 'Asian'
                - 'Black or African American'
                - 'More than one race'
                - 'Native Hawaiian or Other Pacific Islander'
                - 'White'

      - name: year
        description: Birth year (2016-2024; earlier years unavailable for Single Race)
        data_tests:
          - not_null

      - name: births
        description: Total births. NULL when CDC suppressed value (cell < 10 births).

      - name: avg_birth_weight_grams
        description: Average birth weight in grams for this group.

      - name: avg_gestational_age_weeks
        description: Average gestational age in weeks (LMP-based).
